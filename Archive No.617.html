<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>ÆSIR Recovery Terminal</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#05070a;
    overflow:hidden;
    font-family:'Share Tech Mono', monospace;
    color:#7df9ff;
}

/* Scanlines */

.scanlines{
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
    repeating-linear-gradient(
        to bottom,
        rgba(255,255,255,0.03),
        rgba(255,255,255,0.03) 1px,
        transparent 1px,
        transparent 3px
    );
    mix-blend-mode:soft-light;
    animation:flicker 0.12s infinite;
    z-index:50;
}

@keyframes flicker{
    0%{opacity:0.95;}
    50%{opacity:1;}
    100%{opacity:0.97;}
}

/* Main Container */

.container{
    position:relative;
    z-index:2;
    width:100%;
    height:100vh;
    padding:40px;
}

/* Logo */

.logo{
    color:#ff4fd8;
    font-size:28px;
    margin-bottom:25px;
    text-shadow:0 0 8px #ff4fd8;
}

/* Terminal */

.terminal{
    border:1px solid rgba(125,249,255,0.3);
    background:rgba(0,0,0,0.55);
    padding:25px;
    height:75vh;
    overflow:hidden;

    box-shadow:
    0 0 20px rgba(125,249,255,0.15),
    inset 0 0 20px rgba(125,249,255,0.05);
}

.line{
    margin:10px 0;
    white-space:pre-wrap;
    opacity:0;
    animation:fadeIn 0.5s forwards;
}

@keyframes fadeIn{
    to{
        opacity:1;
    }
}

/* Cursor */

.cursor{
    display:inline-block;
    width:10px;
    height:18px;
    background:#7df9ff;
    margin-left:5px;
    animation:blink 0.8s infinite;
}

@keyframes blink{
    50%{
        opacity:0;
    }
}

/* Warning */

.warning{
    color:#ff4fd8;
    text-shadow:0 0 10px #ff4fd8;
}

/* Progress */

.progress-container{
    margin-top:20px;
    width:100%;
    height:20px;
    border:1px solid #7df9ff;
}

.progress-bar{
    height:100%;
    width:0%;
    background:#7df9ff;
    box-shadow:0 0 15px #7df9ff;
    transition:width 0.2s;
}

/* Glitch Overlay */

.glitch{
    position:absolute;
    inset:0;
    background:rgba(255,0,100,0.03);
    mix-blend-mode:screen;
    animation:glitch 0.15s infinite;
    pointer-events:none;
    z-index:10;
}

@keyframes glitch{
    0%{transform:translate(0);}
    20%{transform:translate(-2px,1px);}
    40%{transform:translate(2px,-1px);}
    60%{transform:translate(-1px,2px);}
    80%{transform:translate(1px,-2px);}
    100%{transform:translate(0);}
}

/* Final Video */

.hidden-video{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
    z-index:999;
    background:black;
}

/* Flash Effect */

@keyframes glitchFlash{
    0%{
        filter:hue-rotate(0deg);
    }

    50%{
        filter:hue-rotate(90deg) brightness(1.5);
    }

    100%{
        filter:hue-rotate(0deg);
    }
}

</style>
</head>

<body>

<div class="scanlines"></div>
<div class="glitch"></div>

<div class="container">

    <div class="logo">
        ÆSIR MEMORY RECOVERY SYSTEM
    </div>

    <div class="terminal" id="terminal"></div>

</div>

<!-- LOCAL MP4 VIDEO -->

<video
id="video"
class="hidden-video"
autoplay
playsinline
controls>

    <source
    src="Rick Astley - Never Gonna Give You Up (Official Video) (4K Remaster).mp4"
    type="video/mp4">

</video>

<script>

const terminal = document.getElementById("terminal");

/* Terminal Lines */

const lines = [

"[BOOT] Initializing neural interface...",
"[OK] Connection established.",
"[SYNC] Accessing archived emotional buffer...",
"[WARNING] Corrupted memory sectors detected.",
"[RECOVERY] Attempting restoration...",
"[NEKO_NODE] User trace located.",
"[ACCESS LEVEL : UNAUTHORIZED]",
"",
"Recovered file:",
"\"NEKO_FINAL_ARCHIVE.mp4\"",
"",
"> decrypting archive..."

];

let delay = 0;

/* Type Lines */

lines.forEach((text) => {

    setTimeout(() => {

        const div = document.createElement("div");

        div.className = "line";

        if(
            text.includes("WARNING") ||
            text.includes("UNAUTHORIZED")
        ){
            div.classList.add("warning");
        }

        div.textContent = text;

        terminal.appendChild(div);

        terminal.scrollTop = terminal.scrollHeight;

    }, delay);

    delay += 850;

});

/* Progress Bar */

setTimeout(() => {

    const progressContainer =
    document.createElement("div");

    progressContainer.className =
    "progress-container";

    const progressBar =
    document.createElement("div");

    progressBar.className =
    "progress-bar";

    progressContainer.appendChild(progressBar);

    terminal.appendChild(progressContainer);

    let progress = 0;

    const interval = setInterval(() => {

        progress += Math.random() * 12;

        progressBar.style.width =
        progress + "%";

        if(progress >= 100){

            clearInterval(interval);

            const finalLine =
            document.createElement("div");

            finalLine.className =
            "line warning";

            finalLine.innerHTML =
            '[ARCHIVE RECOVERED]<span class="cursor"></span>';

            terminal.appendChild(finalLine);

            /* Final Glitch */

            setTimeout(() => {

                document.body.style.animation =
                "glitchFlash 0.15s 10";

            }, 500);

            /* PLAY VIDEO */

            setTimeout(() => {

                const video =
                document.getElementById("video");

                video.style.display = "block";

                video.play();

            }, 1500);

        }

    }, 180);

}, delay + 800);

</script>

</body>
</html>
